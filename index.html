<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Agarwood - Nâng Tầm Giá Trị Trầm Hương</title>
    <!-- Google Fonts: Cinzel for luxury headings, Montserrat for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Premium Sticky Header -->
    <header class="main-header" id="mainHeader">
        <div class="header-container">
            <!-- Brand Logo -->
            <a href="#" class="logo-area" id="logoLink">
                <div class="logo-svg">
                    <svg viewBox="0 0 100 100" class="gold-tree-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- Outer Elegant Thin Circle -->
                        <circle cx="50" cy="50" r="48" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="3 3"/>
                        <!-- Inner Gold Tree Symbol -->
                        <defs>
                            <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#C59737" />
                                <stop offset="50%" stop-color="#F3D075" />
                                <stop offset="100%" stop-color="#C59737" />
                            </linearGradient>
                        </defs>
                        <!-- Trunk & Roots -->
                        <path d="M47 80 C 47 75, 43 70, 43 65 C 43 60, 48 55, 48 45 L 52 45 C 52 55, 57 60, 57 65 C 57 70, 53 75, 53 80 Z" fill="url(#goldGradient)"/>
                        <path d="M48 78 C 42 82, 35 83, 30 84 C 35 81, 44 79, 47 76 Z" fill="url(#goldGradient)"/>
                        <path d="M52 78 C 58 82, 65 83, 70 84 C 65 81, 56 79, 53 76 Z" fill="url(#goldGradient)"/>
                        <!-- Main Branches -->
                        <path d="M46 52 C 38 48, 32 40, 28 35 C 33 39, 41 45, 47 48 Z" fill="url(#goldGradient)"/>
                        <path d="M54 52 C 62 48, 68 40, 72 35 C 67 39, 59 45, 53 48 Z" fill="url(#goldGradient)"/>
                        <path d="M50 46 C 50 35, 47 25, 40 18 C 46 24, 49 32, 50 40 Z" fill="url(#goldGradient)"/>
                        <path d="M50 46 C 50 35, 53 25, 60 18 C 54 24, 51 32, 50 40 Z" fill="url(#goldGradient)"/>
                        <!-- Stylized Leaf Canopy (Dots/Leaves) -->
                        <circle cx="50" cy="15" r="4" fill="url(#goldGradient)"/>
                        <circle cx="38" cy="22" r="3.5" fill="url(#goldGradient)"/>
                        <circle cx="62" cy="22" r="3.5" fill="url(#goldGradient)"/>
                        <circle cx="28" cy="30" r="3" fill="url(#goldGradient)"/>
                        <circle cx="72" cy="30" r="3" fill="url(#goldGradient)"/>
                        <circle cx="20" cy="42" r="3" fill="url(#goldGradient)"/>
                        <circle cx="80" cy="42" r="3" fill="url(#goldGradient)"/>
                        <circle cx="34" cy="34" r="2.5" fill="url(#goldGradient)"/>
                        <circle cx="66" cy="34" r="2.5" fill="url(#goldGradient)"/>
                        <circle cx="44" cy="28" r="3" fill="url(#goldGradient)"/>
                        <circle cx="56" cy="28" r="3" fill="url(#goldGradient)"/>
                        <circle cx="48" cy="38" r="2" fill="url(#goldGradient)"/>
                        <circle cx="52" cy="38" r="2" fill="url(#goldGradient)"/>
                        <!-- Additional Roots flare -->
                        <path d="M50 78 C 50 82, 50 86, 50 88" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="brand-title">WORLD</span>
                    <span class="brand-subtitle">AGARWOOD</span>
                    <span class="brand-slogan">NÂNG TẦM GIÁ TRỊ TRẦM HƯƠNG</span>

            </a>

            <!-- Desktop Navigation Menu -->
            <nav class="nav-menu" id="navMenu">
                <ul>
                    <li>
                        <a href="#trang-chu" class="nav-item active" id="navHome">
                            <i class="fa-solid fa-house"></i> TRANG CHỦ
                        </a>
                    </li>
                    <li><a href="#cong-nghe" class="nav-item" id="navTech">CÔNG NGHỆ</a></li>
                    <li><a href="#quy-trinh" class="nav-item" id="navProcess">QUY TRÌNH</a></li>
                    <li><a href="#dau-tu" class="nav-item" id="navInvest">ĐẦU TƯ</a></li>

            <!-- Call To Action Button (Liên Hệ Ngay) -->
            <div class="header-cta">
                <a href="tel:+84903885179" class="cta-button" id="ctaBtn">
                    <div class="cta-shine"></div>
                    <i class="fa-solid fa-phone-volume"></i>
                    <span>LIÊN HỆ NGAY</span>
                </a>
            </div>

            <!-- Hamburger Button for Mobile -->
            <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

            <li><a href="#ve-chung-toi" class="drawer-item" id="drawerAbout">VỀ CHÚNG TÔI</a></li>
            <li><a href="#lien-he" class="drawer-item" id="drawerContact">LIÊN HỆ</a></li>
        </ul>
        <div class="drawer-footer">
            <a href="tel:+84903885179" class="drawer-cta-button">
                <i class="fa-solid fa-phone"></i> LIÊN HỆ NGAY
            </a>

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- Main Content Section -->
    <main id="mainSection"></main>

    <!-- Footer Section -->
    <footer id="footerSection"></footer>

    <script src="script.js"></script>
